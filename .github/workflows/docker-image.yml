name: Docker Image CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose ls || true
      - run: docker compose -f docker-compose.yml config
      - name: Wait for the participant environment
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 600
      - name: Check the ready environment
        run: docker compose exec -T devcontainer python -m unittest data_contract_components/prevention/test_data_contract_violations.py -v
      - name: Verify the seeded object count
        run: |
          docker compose exec -T devcontainer python - <<'PY'
          from data_contract_components.data_assets._query_postgres_helper import PostgresDB
          counts = PostgresDB().query("SELECT COUNT(*), COUNT(DISTINCT object_id) FROM object")
          assert counts.iloc[0].tolist() == [3025, 3025], counts
          PY
      - name: Capture startup logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the test environment
        if: always()
        run: docker compose down
  
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose ls || true
      - run: docker compose -f docker-compose.test.yml config
      - run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --attach-dependencies --exit-code-from devcontainer
      - name: Comment on PR if data contract violations are detected
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.readFileSync('test_output.log', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ Data contract violations detected:\n\n\`\`\`\n${testOutput}\n\`\`\``
            })
